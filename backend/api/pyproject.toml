[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colourlock-api"
version = "0.1.0"
description = "ColourLock HTTP API: study explorer, scoring, provenance."
requires-python = ">=3.11"
dependencies = [
    "colourlock",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "boto3>=1.34",
    "openpyxl>=3.1",  # history export as .xlsx
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8.0", "httpx>=0.27", "anyio>=4.0"]

[tool.setuptools.packages.find]
include = ["app*"]

# The measurement package lives in this repo, not on PyPI. uv (which Vercel uses to install
# this service) reads this; plain pip ignores it, so local installs still use
# `pip install -e packages/colourlock` first.
[tool.uv.sources]
colourlock = { path = "../../packages/colourlock" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that load the full study dataset"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
